
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # single server implementation for VueJS app.
    server {
        listen  *:8080;
        root    /usr/share/nginx/html;
        index   index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Optional: Proxy the Salesforce OAuth token exchange endpoint.
        # If the browser's CORS policy blocks the direct token exchange POST to
        # login.salesforce.com, uncomment and adjust the block below so that
        # the browser sends the request to the same origin instead.
        #
        # IMPORTANT: Replace login.salesforce.com with the correct host for your
        # Salesforce instance (e.g. test.salesforce.com for sandbox orgs).
        # Also update the 'tokenUrl' computed property in src/stores/auth.js to
        # point to the proxied endpoint, e.g.:
        #   const tokenUrl = computed(() => '/oauth2/token');
        #
        #location /oauth2/token {
        #    proxy_pass https://login.salesforce.com/services/oauth2/token;
        #    proxy_set_header Host login.salesforce.com;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #    proxy_set_header X-Forwarded-Proto $scheme;
        #}
    }
}
